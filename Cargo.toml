[package]
name = "mdbook-og-cards"
version = "0.1.0"
edition = "2021"
description = "mdBook preprocessor that converts explicitly-marked links into Open Graph preview cards at build time"
license = "MIT"

[[bin]]
name = "mdbook-og-cards"
path = "src/main.rs"

[lib]
name = "mdbook_og_cards"
path = "src/lib.rs"

[dependencies]
mdbook = { version = "0.4", default-features = false }
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
semver = "1"
anyhow = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
tempfile = "3"
