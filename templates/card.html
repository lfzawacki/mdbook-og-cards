<!--
  Reference template for the HTML produced by mdbook-og-cards.
  The actual renderer (src/renderer.rs) builds this string directly in Rust
  for zero runtime templating overhead; this file exists purely as
  documentation of the exact structure/classes you can target with custom
  CSS. Editing this file has no effect on the generated output.
-->
<a class="og-card" href="{{url}}" target="_blank" rel="noopener noreferrer">
  <img class="og-card-image" src="{{image}}" alt="" loading="lazy">
  <span class="og-card-body">
    <strong class="og-card-title">{{title}}</strong>
    <span class="og-card-description">{{description}}</span>
    <small class="og-card-source">{{site_name}}</small>
  </span>
</a>
